 GNU nano 6.2        /etc/nginx/sites-available/cache.conf *
server {
    listen 8081;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache my_cache;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status;   # shows HIT or >
    }
}





