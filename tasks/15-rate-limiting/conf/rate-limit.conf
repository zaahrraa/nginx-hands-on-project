server {
    listen 8081;
    server_name localhost;

    # Rate limiting
    limit_req zone=mylimit burst=10 nodelay;
    
    # Connection limiting
    limit_conn addr 5;

    # Buffering settings
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}