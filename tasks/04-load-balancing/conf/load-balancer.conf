upstream backend_pool {
    # round robin is the default — just list servers, no keyword needed
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;

    # to test least_conn instead, comment above list style off and use:
    # least_conn;
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;

    # to test ip_hash instead (same client always → same server):
    # ip_hash;
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;
}

server {
    listen 8081;
    server_name localhost;

    location / {
        proxy_pass http://backend_pool;
    }
}




