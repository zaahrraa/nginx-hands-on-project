server {
    listen 8081;
    server_name localhost;

    root /var/www/static-site;
    index index.html;

    # Custom error pages
    error_page 404 /404.html;
    error_page 403 /403.html;

    # Serve custom error pages from /var/www/errors
    location = /404.html {
        root /var/www/errors;
        internal;
    }

    location = /403.html {
        root /var/www/errors;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}